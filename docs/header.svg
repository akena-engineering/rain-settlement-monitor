<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" fill="none" font-family="'Inter Tight', Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Settlement Monitor: Rain's daily card settlement, checked from public chain data</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1280" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c3cfdb" />
      <stop offset="0.42" stop-color="#b7c4d1" />
      <stop offset="1" stop-color="#93a3b8" />
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#sky)" />
  <rect x="0.5" y="0.5" width="1279" height="319" rx="23.5" stroke="#121212" stroke-opacity="0.08" />

  <!-- Brand mark (the app's favicon) and name -->
  <g transform="translate(72 84)">
    <rect width="64" height="64" rx="18" fill="#121212" />
    <rect x="16" y="32" width="8" height="18" rx="4" fill="#ff2fb6" />
    <rect x="28" y="20" width="8" height="30" rx="4" fill="#ff2fb6" />
    <rect x="40" y="28" width="8" height="22" rx="4" fill="#ff2fb6" />
    <rect x="18" y="16" width="4" height="8" rx="2" fill="#ffaefd" />
    <rect x="42" y="12" width="4" height="8" rx="2" fill="#ffaefd" />
  </g>
  <text x="156" y="136" font-size="56" font-weight="700" letter-spacing="-2" fill="#121212">Settlement Monitor</text>
  <text x="72" y="206" font-size="28" fill="#121212">Rain's daily card settlement, batch by batch:</text>
  <text x="72" y="244" font-size="28" fill="#121212">complete, on time and paid, from public chain data.</text>

  <!-- Daily batches against their baseline; 6 Nov arrived at 38% -->
  <g>
    <rect x="732" y="48" width="476" height="224" rx="16" fill="#ffffff" fill-opacity="0.35" stroke="#121212" stroke-opacity="0.08" />
    <text x="760" y="84" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="15" fill="#121212">6 Nov · <tspan fill="#d93036">38% of baseline</tspan></text>
    <line x1="760" y1="142.4" x2="1180" y2="142.4" stroke="#121212" stroke-opacity="0.45" stroke-dasharray="4 5" />
    <text x="1180" y="134.4" text-anchor="end" font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#121212" fill-opacity="0.6">baseline</text>
    <rect x="760" y="144.2" width="24" height="87.8" rx="6" fill="#ffffff" fill-opacity="0.92" />
    <rect x="796" y="141.5" width="24" height="90.5" rx="6" fill="#ffffff" fill-opacity="0.92" />
    <rect x="832" y="146.0" width="24" height="86.0" rx="6" fill="#ffffff" fill-opacity="0.92" />
    <rect x="868" y="151.4" width="24" height="80.6" rx="6" fill="#ffffff" fill-opacity="0.92" />
    <rect x="904" y="138.8" width="24" height="93.2" rx="6" fill="#ffffff" fill-opacity="0.92" />
    <rect x="940" y="142.4" width="24" height="89.6" rx="6" fill="#ffffff" fill-opacity="0.92" />
    <rect x="976" y="141.5" width="24" height="90.5" rx="6" fill="#ffffff" fill-opacity="0.92" />
    <rect x="1012" y="198.0" width="24" height="34.0" rx="6" fill="#d93036" />
    <rect x="1048" y="148.7" width="24" height="83.3" rx="6" fill="#ffffff" fill-opacity="0.92" />
    <rect x="1084" y="135.2" width="24" height="96.8" rx="6" fill="#ffffff" fill-opacity="0.92" />
    <rect x="1120" y="136.1" width="24" height="95.9" rx="6" fill="#ffffff" fill-opacity="0.92" />
    <rect x="1156" y="134.3" width="24" height="97.7" rx="6" fill="#ffffff" fill-opacity="0.92" />
    <line x1="760" y1="232.5" x2="1180" y2="232.5" stroke="#121212" stroke-opacity="0.15" />
    <g font-family="'IBM Plex Mono', ui-monospace, Menlo, monospace" font-size="13" fill="#121212" fill-opacity="0.6">
      <text x="760" y="256">30 Oct</text>
      <text x="1024" y="256" text-anchor="middle" fill="#d93036" fill-opacity="1">6 Nov</text>
      <text x="1180" y="256" text-anchor="end">11 Nov</text>
    </g>
  </g>
</svg>
